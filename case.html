<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crack the Case · A business case study every week · Dr. Lehri</title>
<meta name="description" content="A real business case every week, built from public facts. Read it, make the call, and see what the company actually did. By Dr. Bikram Paul Singh Lehri.">

<meta property="og:type" content="website">

<meta property="og:description" content="You bring the judgment, I'll bring the cases. A real business case study every week.">

<meta property="og:url" content="https://youngprofessor.in/case.html">

<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,900;1,500&family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#F2ECDC;color:#23201A;font-family:Manrope,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:clip}
button{font-family:inherit}
.top{position:sticky;top:0;z-index:5;background:#F2ECDC;border-bottom:1px solid #D8CFB9;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 10px;height:56px;padding-top:env(safe-area-inset-top)}
.top a,.top button{border:0;background:none;font:700 14px Manrope,sans-serif;color:#23201A;cursor:pointer;min-height:44px;padding:0 10px;display:flex;align-items:center;text-decoration:none}
.top span{font:500 11.5px 'JetBrains Mono',monospace;letter-spacing:.14em;color:#5E5645}
.top .x{width:44px;justify-content:center;font-size:24px;border-radius:22px;background:rgba(0,0,0,.07)}
.in{max-width:540px;margin:0 auto;padding:10px 20px 60px}
.mt{border-top:3px solid #23201A;border-bottom:1px solid #23201A;padding:7px 0 5px;font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(28px,8vw,38px);letter-spacing:.02em;line-height:1;text-align:center}
.ms{display:flex;justify-content:space-between;gap:8px;font:500 12px/1 'JetBrains Mono',monospace;letter-spacing:.08em;padding:7px 2px;border-bottom:3px double #23201A}
.co{margin:16px 0 0;font:800 12px/1 Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#A8480A}
h1{margin:6px 0 6px;font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(29px,8.4vw,38px);line-height:1.05}
.dk{font-family:'Playfair Display',serif;font-style:italic;font-weight:500;font-size:17px;line-height:1.35;color:#4A4234;margin:0 0 14px}
.ch{border:1px solid #23201A;padding:10px 10px 6px;margin-bottom:16px}
.ch h2{font:800 12.5px/1.3 Manrope,sans-serif;letter-spacing:.04em;margin:0 0 4px;color:#23201A}
.ch svg{display:block;width:100%;height:auto}
.p{margin:0 0 13px;font-size:16.5px;line-height:1.65}
.tm{margin:20px 0 4px;border:1px solid #23201A;background:#FBF7EA;padding:14px 16px 6px}.tm h3{font:800 12.5px/1 Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#A8480A;margin-bottom:10px}.tm dt{font-family:'Playfair Display',serif;font-weight:900;font-size:18px;margin-top:2px}.tm dd{font-size:15.5px;line-height:1.55;margin:0 0 12px}
.dc{display:flex;align-items:center;gap:10px;margin:22px 0 6px}
.dc span{background:#23201A;color:#F2ECDC;font:500 12px/1 'JetBrains Mono',monospace;letter-spacing:.12em;padding:6px 9px;transform:rotate(-2deg);white-space:nowrap}
.q{font-family:'Playfair Display',serif;font-weight:900;font-size:22px;line-height:1.2;margin:0 0 6px}
.o{display:flex;gap:12px;align-items:center;width:100%;min-height:54px;padding:9px 6px;border:0;border-top:1px solid #B9AE95;background:none;text-align:left;font:500 16px/1.4 Manrope,sans-serif;color:#23201A;cursor:pointer}
.o:hover:not(:disabled){background:rgba(35,32,26,.06)}
.o:focus-visible,.top a:focus-visible,.top button:focus-visible,.go:focus-visible,.ar a:focus-visible{outline:3px solid #A8480A;outline-offset:2px}
.o i{font-style:normal;flex:none;width:30px;height:30px;border:2px solid #23201A;border-radius:50%;display:flex;align-items:center;justify-content:center;font:900 14px 'Playfair Display',serif}
.o.ok{background:#E3F3EA}.o.ok i{background:#1F7A4C;border-color:#1F7A4C;color:#fff}
.o.no{background:#FBE9E3}.o.no i{background:#A8480A;border-color:#A8480A;color:#fff}
.o.dim{opacity:.6}
.o:disabled{cursor:default}
.fb{display:none;margin-top:8px;border:1px solid #23201A;padding:13px 15px;font-size:15.5px;line-height:1.6;background:#fff}
.fb b{display:block;font-family:'Playfair Display',serif;font-weight:900;font-size:19px;margin-bottom:3px}
.fb .best{margin-top:10px;padding-top:10px;border-top:1px dashed #B9AE95}
.fb .best b{font-size:15px}
textarea{width:100%;min-height:96px;border:1px solid #23201A;background:#fff;padding:12px;font:500 16px/1.5 Manrope,sans-serif;color:#23201A;border-radius:0;resize:vertical}
.go{margin-top:10px;border:0;background:#23201A;color:#F2ECDC;font:800 15px Manrope,sans-serif;padding:0 20px;min-height:48px;cursor:pointer;border-radius:3px}
.go[disabled]{opacity:.5;cursor:default}
.hint{font-size:13px;color:#5E5645;margin-top:6px}
.after{display:none;margin-top:22px;border-top:3px solid #23201A;border-bottom:1px solid #23201A;padding:14px 0}
.after h3{font:800 12.5px/1 Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#A8480A;margin-bottom:8px}
.src{margin-top:20px;font-size:13.5px;line-height:1.7;color:#4A4234}
.src b{display:block;font:800 12px/1 Manrope,sans-serif;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px;color:#23201A}
.src a{color:#23201A;text-underline-offset:2px;display:inline-block;padding:3px 0}
.sh{display:none;margin-top:18px}
.sh a{display:inline-flex;align-items:center;min-height:46px;padding:0 18px;border:2px solid #23201A;color:#23201A;font:800 14.5px Manrope,sans-serif;text-decoration:none;border-radius:3px}
.ar{margin-top:30px;border-top:3px double #23201A;padding-top:14px}
.ar h3{font:800 12.5px/1 Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.ar a{display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:50px;border-top:1px solid #B9AE95;text-decoration:none;color:#23201A;font-size:15.5px;line-height:1.35;padding:8px 2px}
.ar a small{font:500 11.5px 'JetBrains Mono',monospace;color:#5E5645;white-space:nowrap}
.ar a em{font-style:normal;font-weight:800}
.note{margin:22px 0 0;font-size:13px;color:#4A4234;line-height:1.55}
.fold{animation:fold .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 0}
@keyframes fold{from{opacity:0;transform:perspective(900px) rotateX(-14deg) translateY(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fold{animation:none}}
.err{padding:60px 20px;text-align:center;font-size:17px}
</style>
</head>
<body>
<script src="room-intro.js" data-room="case"></script>
<div class="top"><a href="student.html" id="back">&larr; Student Zone</a><span>CASE OF THE WEEK</span><a class="x" href="student.html" aria-label="Close the case">&times;</a></div>
<main class="in" id="app" aria-live="polite"><p class="err">Opening this week&rsquo;s case&hellip;</p></main>
<script>
(function(){
var d=document,$=function(i){return d.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var DAYS=['SUN','MON','TUE','WED','THU','FRI','SAT'],MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function fd(s){var x=pd(s);return DAYS[x.getDay()]+' '+x.getDate()+' '+MON[x.getMonth()]}
function fn(v,u){var t=(Math.round(v*100)/100).toLocaleString('en-IN');return u==='%'?t+'%':u==='m'?t+'m':t}
function chart(c){
 var P=c.points,W=340,H=150,l=18,r=18,t=26,b=34,mx=Math.max.apply(null,P.map(function(p){return p[1]}))*1.08||1,
 X=function(i){return P.length<2?W/2:l+(W-l-r)*i/(P.length-1)},Y=function(v){return t+(H-t-b)*(1-v/mx)};
 var pts=P.map(function(p,i){return X(i).toFixed(1)+','+Y(p[1]).toFixed(1)}).join(' '),h='';
 h+='<line x1="'+l+'" y1="'+(H-b)+'" x2="'+(W-r)+'" y2="'+(H-b)+'" stroke="#23201A"/>';
 h+='<polyline points="'+pts+'" fill="none" stroke="#A8480A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
 P.forEach(function(p,i){var x=X(i),y=Y(p[1]),a=i===0?'start':i===P.length-1?'end':'middle',lx=i===0?x-8:i===P.length-1?x+8:x;
  h+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(i===c.mark?6:3.5)+'" fill="'+(i===c.mark?'#F2ECDC':'#A8480A')+'" stroke="#A8480A" stroke-width="2.5"/>';
  h+='<text x="'+lx.toFixed(1)+'" y="'+(y-11).toFixed(1)+'" font-size="12" font-weight="800" fill="#23201A" text-anchor="'+a+'">'+esc(fn(p[1],c.unit))+'</text>';
  h+='<text x="'+lx.toFixed(1)+'" y="'+(H-14)+'" font-size="11" fill="#5E5645" text-anchor="'+a+'">'+esc(p[0])+'</text>'});
 if(c.markText&&P[c.mark]){var mi=c.mark;h+='<text x="'+X(mi).toFixed(1)+'" y="'+(H-2)+'" font-size="10.5" font-weight="800" fill="#A8480A" text-anchor="'+(mi===0?'start':mi===P.length-1?'end':'middle')+'">&#9650; '+esc(c.markText)+'</text>'}
 var lab=c.title+': '+P.map(function(p){return p[0]+' '+fn(p[1],c.unit)}).join(', ');
 return '<div class="ch"><h2>'+esc(c.title)+'</h2><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(lab)+'">'+h+'</svg></div>'}
function render(C,all,idx){
 var key='cc_'+C.id,saved={};try{saved=JSON.parse(ls(key)||'{}')}catch(e){}
 function save(){ls(key,JSON.stringify(saved))}
 d.title=C.company+': '+C.title+' · Crack the Case';
 var h='<div class="fold"><div class="mt">CRACK THE CASE</div><div class="ms"><span>'+fd(C.date)+'</span><span>REAL CASE</span><span>No. '+(idx+1)+'</span></div>';
 h+='<p class="co">'+esc(C.company)+(C.field?' &middot; '+esc(C.field):'')+'</p><h1>'+esc(C.title)+'</h1><p class="dk">'+esc(C.deck)+'</p>'+chart(C.chart);
 C.story.forEach(function(p){h+='<p class="p">'+esc(p)+'</p>'});
 if(C.terms&&C.terms.length){h+='<div class="tm"><h3>Words to know</h3><dl>'+C.terms.map(function(t){return '<dt>'+esc(t[0])+'</dt><dd>'+esc(t[1])+'</dd>'}).join('')+'</dl></div>'}
 C.questions.forEach(function(q,qi){h+='<div class="dc"><span>DECISION TIME &middot; '+(qi+1)+' OF 3</span></div><p class="q">'+esc(q.q)+'</p><div id="o'+qi+'"></div><div class="fb" id="f'+qi+'"></div>'});
 h+='<div class="dc"><span>YOUR TURN &middot; 3 OF 3</span></div><p class="q">'+esc(C.open.q)+'</p><textarea id="ta" aria-label="Your answer" placeholder="Write a few lines in your own words (optional)"></textarea><button class="go" id="ob" type="button">Show a sample answer</button><p class="hint">Your words stay on your phone. Nobody else sees them.</p><div class="fb" id="of"></div>';
 h+='<div class="after" id="af"><h3>What happened next</h3><p class="p" style="margin:0">'+esc(C.after)+'</p></div>';
 h+='<div class="src"><b>Sources</b>'+C.sources.map(function(s){return '<a href="'+esc(s[1])+'" target="_blank" rel="noopener noreferrer">'+esc(s[0])+'</a><br>'}).join('')+'</div>';
 h+='<div class="sh" id="sh"><a id="wa" href="#" target="_blank" rel="noopener noreferrer">Share this case on WhatsApp</a></div>';
 var past=all.map(function(c,i){return[c,i]}).filter(function(x){return x[0].id!==C.id&&x[0].date<=today()}).reverse();
 if(past.length){h+='<div class="ar"><h3>Earlier cases</h3>'+past.map(function(x){return '<a href="case.html?case='+encodeURIComponent(x[0].id)+'"><span><em>'+esc(x[0].company)+'</em> &middot; '+esc(x[0].title)+'</span><small>'+fd(x[0].date)+'</small></a>'}).join('')+'</div>'}
 h+='<p class="note">A real case from public facts, shown with its sources. It is a learning exercise, not advice, and some details are simplified. Every option is explained, so you learn from each one.</p></div>';
 $('app').innerHTML=h;
 var L='ABCD';
 C.questions.forEach(function(q,qi){
  var box=$('o'+qi),fb=$('f'+qi),best=q.options.findIndex(function(o){return o.ok});
  box.innerHTML=q.options.map(function(o,i){return '<button class="o" type="button" data-i="'+i+'"><i>'+L[i]+'</i><span>'+esc(o.t)+'</span></button>'}).join('');
  function pick(i,fromSaved){var bs=box.children;[].forEach.call(bs,function(x,k){x.className='o '+(k===best?'ok':(k===i?'no':'dim'));x.disabled=true});
   var o=q.options[i],ok=i===best;
   fb.style.display='block';
   fb.innerHTML='<b>'+(ok?'Good thinking.':'Not quite.')+'</b>'+esc(o.why)+(ok?'':'<div class="best"><b>Best answer: '+L[best]+'</b>'+esc(q.options[best].why)+'</div>');
   if(!fromSaved){saved['q'+qi]=i;save();fb.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'})}
   check()}
  [].forEach.call(box.children,function(b){b.addEventListener('click',function(){pick(+b.dataset.i,false)})});
  if(saved['q'+qi]!==undefined)pick(saved['q'+qi],true)});
 function check(){if(saved.q0!==undefined&&saved.q1!==undefined&&saved.open)reveal()}
 function reveal(){$('af').style.display='block';$('sh').style.display='block';
  var u='https://youngprofessor.in/case.html?case='+encodeURIComponent(C.id),t='Crack the Case: '+C.company+', "'+C.title+'". Would you have made the right call? '+u;
  $('wa').href='https://wa.me/?text='+encodeURIComponent(t)}
 var ta=$('ta'),of=$('of');
 if(saved.text)ta.value=saved.text;
 ta.addEventListener('input',function(){saved.text=ta.value;save()});
 function showOpen(){of.style.display='block';of.innerHTML='<b>A strong answer</b>'+esc(C.open.model);$('ob').textContent='Sample answer shown';$('ob').disabled=true;saved.open=1;save();check()}
 $('ob').addEventListener('click',showOpen);
 if(saved.open)showOpen();
}
function today(){var n=new Date(),m=n.getMonth()+1,dd=n.getDate();return n.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd}
fetch('cases.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
 var all=(j.cases||[]).slice().sort(function(a,b){return a.date<b.date?-1:1}),q=new URLSearchParams(location.search).get('case'),t=today(),idx=-1;
 if(q)idx=all.findIndex(function(c){return c.id===q&&c.date<=t});
 if(idx<0){for(var i=0;i<all.length;i++)if(all[i].date<=t)idx=i}
 if(idx<0)idx=0;
 render(all[idx],all,idx)
}).catch(function(){$('app').innerHTML='<p class="err">This week&rsquo;s case could not load. Please check your connection and <a href="case.html">try again</a>.</p>'});
})();
</script>
</body>
</html>
