<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verify a Certificate | youngprofessor.in</title>
<meta name="description" content="Verify a Certificate of Clarity issued by youngprofessor.in (Find Your Fit).">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0A0A">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@500&family=Manrope:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#0B0A0A;--line:#2A2323;--line2:#3A2E2E;--ink:#F4EFEA;--muted:#A39A94;--red:#E3161E;--gold:#E2B85C;--ok:#6FC3B2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;min-height:100vh;background-image:radial-gradient(800px 400px at 50% -10%,rgba(227,22,30,.14),transparent 60%)}
.nav{border-bottom:1px solid var(--line)}.nav div{max-width:900px;margin:0 auto;padding:0 22px;height:64px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font-family:"DM Serif Display",serif;font-size:19px}.logo img{width:38px;height:38px;border-radius:50%}.logo em{color:var(--red);font-style:normal}
main{max-width:640px;margin:0 auto;padding:40px 22px 80px}
.k{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.22em;color:var(--gold)}
h1{font-family:"DM Serif Display",serif;font-weight:400;font-size:44px;margin:10px 0 18px;line-height:1.05}
.card{border-radius:22px;padding:30px;background:#fbf5e6;color:#1d2540;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.45);border:6px double #c9a24a}
.card .brand{font-family:Cinzel,serif;font-weight:700;letter-spacing:.18em;color:#8a1c2b;font-size:20px}
.badge{display:inline-flex;align-items:center;gap:8px;margin:18px 0 6px;padding:8px 16px;border-radius:999px;font-weight:800;font-size:15px}
.badge.ok{background:rgba(46,140,90,.14);color:#1f7a4a}.badge.no{background:rgba(227,22,30,.12);color:#a51d2f}
.nm{font-family:"DM Serif Display",serif;font-size:42px;margin:10px 0 2px}.sp{font-family:"DM Serif Display",serif;font-size:30px;color:#8a1c2b}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:24px;margin-top:18px;font-weight:700}.meta small{display:block;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.2em;color:#8a6a2a;font-weight:400}
.it{font-family:"DM Serif Display",serif;font-style:italic;color:#5b6378}
form{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
input{flex:1 1 200px;min-width:0;background:#120f0f;border:1px solid var(--line2);border-radius:12px;padding:14px 16px;color:var(--ink);font-size:16px;font-family:inherit}
button,.btn{border:0;border-radius:12px;padding:14px 22px;background:var(--red);color:#fff;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}
p{color:var(--muted)}
</style>
</head>
<body>
<nav class="nav"><div><a class="logo" href="index.html"><img src="logo-mark.webp" alt=""><span>young<em>professor</em>.in</span></a></div></nav>
<main>
  <span class="k">Certificate verification</span>
  <h1>Verify a Certificate of Clarity</h1>
  <div id="out"></div>
  <form id="f"><input id="id" placeholder="Certificate no. e.g. FYF-26-AB3D-XY7K" autocomplete="off"><input id="n" placeholder="Name on the certificate" autocomplete="off"><button>Verify</button></form>
  <p style="font-size:14px">Scanning the QR code on a certificate opens this page and checks it automatically.</p>
  <p style="margin-top:30px"><a class="btn" href="fit.html">🎯 Find your own fit (free)</a></p>
</main>
<script>
(()=>{
const AL='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const SP={mk:'Marketing & Sales',fin:'Finance',hr:'Human Resource Management',ba:'Business Analytics',ops:'Operations & Supply Chain',ent:'Entrepreneurship',ib:'International Business',it:'IT & Systems Management'};
function h4(str){let h=0x811c9dc5;for(const ch of str){h^=ch.codePointAt(0);h=Math.imul(h,0x01000193)>>>0}let s='';for(let i=0;i<4;i++){s+=AL[h%AL.length];h=Math.floor(h/AL.length)}return s}
const norm=s=>s.trim().replace(/\s+/g,' ').toUpperCase();
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function niceDate(d){const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return (+d.slice(6))+' '+m[+d.slice(4,6)-1]+' '+d.slice(0,4)}
function check(id,name,s,d){
  id=(id||'').trim().toUpperCase();const m=id.match(/^FYF-(\d\d)-([A-Z0-9]{4})-([A-Z0-9]{4})$/);if(!m||!name)return null;
  const keys=s&&SP[s]?[s]:Object.keys(SP);
  // with full QR data: exact check. Manual entry: try all specialisations and dates of that year
  const dates=d&&/^\d{8}$/.test(d)?[d]:(()=>{const a=[],y=2000+ +m[1];for(let mo=1;mo<=12;mo++)for(let da=1;da<=31;da++)a.push(y+String(mo).padStart(2,'0')+String(da).padStart(2,'0'));return a})();
  for(const k of keys)for(const dt of dates)if(h4(['YP-FIT-2026',norm(name),k,dt,m[2]].join('|'))===m[3])return{id,name:name.trim(),k,dt};
  return false}
function render(r,id){const o=document.getElementById('out');
  if(r){o.innerHTML=`<div class="card"><div class="brand">YOUNGPROFESSOR.IN</div><div class="badge ok">✔ Genuine certificate</div><p class="it" style="margin:6px 0 0">This Certificate of Clarity was issued to</p><div class="nm">${esc(r.name)}</div><p class="it" style="margin:4px 0">best-fit specialisation</p><div class="sp">${SP[r.k]}</div><div class="meta"><span><small>CERTIFICATE NO.</small>${r.id}</span><span><small>ISSUED</small>${niceDate(r.dt)}</span><span><small>SIGNED BY</small>Dr. Bikram Paul Singh Lehri</span></div></div>`}
  else if(r===false){o.innerHTML=`<div class="card"><div class="brand">YOUNGPROFESSOR.IN</div><div class="badge no">✖ Could not verify</div><p class="it">The certificate number and name do not match. Check the spelling of the name exactly as printed, or scan the QR code on the certificate.</p></div>`}
  else o.innerHTML=''}
const P=new URLSearchParams(location.search);
if(P.get('id')){document.getElementById('id').value=P.get('id');document.getElementById('n').value=P.get('n')||'';render(check(P.get('id'),P.get('n'),P.get('s'),P.get('d')))}
document.getElementById('f').onsubmit=e=>{e.preventDefault();const r=check(document.getElementById('id').value,document.getElementById('n').value);render(r===null?false:r)};
})();
</script>
</body>
</html>
